# Lakeflow Job: RetailQ End to End Job
# Orchestrates: ingestion → pipeline → gold views → semantic layer → dashboard

resources:
  jobs:
    retailq_end_to_end:
      name: RetailQ End to End Job
      queue:
        enabled: true
      tasks:
        # Step 1: Ingest raw data from blob storage to bronze
        - task_key: blob_to_bronze
          notebook_task:
            notebook_path: /Workspace/${bundle.root_path}/notebooks/ingestion/blob_to_bronze.py
            source: WORKSPACE
          depends_on: []

        # Step 2: Run SDP pipeline (bronze → silver → gold)
        - task_key: run_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.retail_transform_v2.id}
          depends_on:
            - task_key: blob_to_bronze

        # Step 3: Create gold layer views
        - task_key: gold_views
          notebook_task:
            notebook_path: /Workspace/${bundle.root_path}/notebooks/gold/gold_views.py
            source: WORKSPACE
          depends_on:
            - task_key: run_pipeline

        # Step 4: Build semantic metric view
        - task_key: semantic_layer
          notebook_task:
            notebook_path: /Workspace/${bundle.root_path}/notebooks/semantic/Metric_view.py
            source: WORKSPACE
          depends_on:
            - task_key: gold_views

        # Step 5: Generate calendar dimension
        - task_key: calendar_dim
          notebook_task:
            notebook_path: /Workspace/${bundle.root_path}/notebooks/semantic/Calendar.py
            source: WORKSPACE
          depends_on:
            - task_key: gold_views
